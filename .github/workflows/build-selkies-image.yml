name: Build Selkies staging image

on:
  push:
    branches:
      - feat/selkies-iframe-viewer
    paths:
      - .github/workflows/build-selkies-image.yml
      - Dockerfile.railway
      - THIRD_PARTY_NOTICES.md
      - package/ego-browser/**
      - package/ego-linux-host/**
      - scripts/railway-entrypoint.sh
      - scripts/railway-selkies-supervisor.sh
      - scripts/selkies-token-bootstrap.mjs
      - scripts/test-railway-owner-lock-container.sh
      - skills/ego-browser/**
      - third_party/selkies/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: selkies-staging-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ego-lite-selkies

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.repository == 'olenanikita1980-cell/ego-lite'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=sha,format=long

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.railway
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify persistent profile owner lock
        run: >-
          bash scripts/test-railway-owner-lock-container.sh
          "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
